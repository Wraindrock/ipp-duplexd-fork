name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The daemon shells out to qpdf, and the e2e suite uses it to inspect
      # the PDFs the mock printer receives.
      - name: Install qpdf and shellcheck
        run: sudo apt-get update && sudo apt-get install -y qpdf shellcheck

      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # PKGBUILD is not checked: it relies on makepkg-provided variables and
      # functions that shellcheck cannot know about.
      - name: Shellcheck
        run: shellcheck packaging/*.sh

      # The version is MAJOR.MINOR.ITERATION (packaging/version.sh); a
      # hand-edited tag or a version that disagrees must fail.
      - name: Version number
        run: |
          ./packaging/version.sh check
          if ./packaging/version.sh check v99.1.1; then
            echo "a tag that disagrees with Cargo.toml must be refused" >&2
            exit 1
          fi

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

  # The RPM spec is only exercised by a real rpmbuild; build it here so a
  # broken spec or file list fails on the pull request, not at release time.
  rpm:
    name: RPM package
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: dnf -y install cargo rust rpm-build make tar gzip qpdf createrepo_c gtk4-devel libadwaita-devel desktop-file-utils && dnf -y clean all

      - uses: actions/checkout@v4

      - name: Build and verify the package
        run: ./packaging/build-rpm.sh

      # The package was renamed, so an installed ipp-duplexd has to go away when
      # the fork is installed; build a stand-in for the old package to prove it.
      - name: Check that it replaces an installed ipp-duplexd
        run: |
          work="$(mktemp -d)"
          cat > "$work/old.spec" <<'SPEC'
          Name:           ipp-duplexd
          Version:        0.1.3
          Release:        1
          Summary:        the package before the rename
          License:        MIT
          BuildArch:      noarch
          %description
          Stand-in for the package this fork used to publish.
          %install
          mkdir -p %{buildroot}
          %files
          %changelog
          SPEC
          rpmbuild -bb --nodeps --define "_topdir $work/top" \
                   --define "_tmppath $work/tmp" "$work/old.spec" >/dev/null
          dnf -y install "$work"/top/RPMS/noarch/ipp-duplexd-0.1.3-1.noarch.rpm
          dnf -y install ./packaging/ipp-duplexd-fork-*.rpm
          if rpm -q ipp-duplexd >/dev/null 2>&1; then
            echo "ipp-duplexd is still installed next to ipp-duplexd-fork"
            exit 1
          fi
          rpm -q ipp-duplexd-fork

      # COPR builds from the SRPM that .copr/Makefile produces, so keep that
      # path working on every pull request too (no compiler needed).
      - name: Build the COPR SRPM
        run: |
          make -f .copr/Makefile srpm outdir="$PWD/srpm"
          rpm -qpl srpm/*.src.rpm

      # The GitHub Pages repository (dnf-repo.yml) is only as good as the
      # index createrepo_c makes, so build it and install from it here too.
      - name: Index the RPM and install it from that index
        run: |
          dir="$PWD/repo/x86_64"
          mkdir -p "$dir"
          cp packaging/*.rpm "$dir/"
          createrepo_c --quiet "$dir"
          dnf -y --repofrompath=ipp-duplexd-fork,"file://$dir" \
                 --setopt=ipp-duplexd-fork.gpgcheck=0 install ipp-duplexd-fork
          rpm -q ipp-duplexd-fork
          ipp-duplexd-fork --lang zh-CN 2>&1 | grep -q '必须指定 --printer'

      # Installing the package has to put the window in the application menu;
      # without the entry and its icon the program is only reachable by hand.
      - name: The package appears in the desktop's application menu
        run: |
          set -eux
          entry=/usr/share/applications/io.github.wraindrock.ipp_duplexd_fork.desktop
          icon=/usr/share/icons/hicolor/512x512/apps/io.github.wraindrock.ipp_duplexd_fork.png
          test -f "$entry"
          test -s "$icon"
          grep -qx 'Type=Application' "$entry"
          grep -qx 'Exec=ipp-duplexd-fork-gui' "$entry"
          grep -qx 'Icon=io.github.wraindrock.ipp_duplexd_fork' "$entry"
          desktop-file-validate "$entry"
          command -v ipp-duplexd-fork-gui

  # The GTK4 front end is an optional feature, so it gets its own job: the
  # default build above stays dependency-free, and this one proves the dialog
  # compiles and answers correctly under a headless X server.
  gui:
    name: GTK4 dialog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4, Xvfb and qpdf
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev xvfb qpdf desktop-file-utils

      - name: Clippy
        run: cargo clippy --all-targets --features gui -- -D warnings

      - name: Build
        run: cargo build --features gui

      - name: Test
        run: cargo test --features gui

      # The application menu entry is a build artifact too: validate it here so
      # a broken one fails before it reaches a package.
      - name: The desktop entry is valid
        run: desktop-file-validate packaging/io.github.wraindrock.ipp_duplexd_fork.desktop

      # The daemon reads the dialog's exit code: zero means "print the backs",
      # anything else leaves the job waiting. Drive the real widgets under
      # Xvfb through the test hook.
      - name: The dialog's exit code is the answer
        run: |
          set -eux
          xvfb-run -a env IPP_DUPLEXD_FORK_GUI_TEST=accept \
            ./target/debug/ipp-duplexd-fork-gui --flip "demo [odd pages]" --lang zh-CN
          if xvfb-run -a env IPP_DUPLEXD_FORK_GUI_TEST=decline \
            ./target/debug/ipp-duplexd-fork-gui --flip "demo [odd pages]"; then
            echo "declining must not exit 0" >&2
            exit 1
          else
            test $? -eq 1
          fi

      # Started from the desktop, with no arguments, the program must open its
      # window instead of printing a usage text; the test hook closes it.
      - name: Starting it with no arguments opens the window
        run: |
          xvfb-run -a env IPP_DUPLEXD_FORK_GUI_TEST=window \
            ./target/debug/ipp-duplexd-fork-gui --lang zh-CN

      # The + dialog builds the detected list and the collapsed Advanced
      # section; with no CUPS in the container this walks the empty branch.
      - name: The add dialog opens and finds nothing
        run: |
          xvfb-run -a env IPP_DUPLEXD_FORK_GUI_TEST=add \
            ./target/debug/ipp-duplexd-fork-gui --lang zh-CN

      # A printer the window knows about must also reach CUPS, or the desktop's
      # printer settings stay empty. A stub lpadmin records what it was told.
      - name: A configured printer is registered with CUPS
        run: |
          set -eux
          dir=$(mktemp -d)
          cat > "$dir/config.toml" <<'EOF'
          [[printer]]
          name = "smoke-duplex"
          listen = "127.0.0.1:6699"
          real = "ipp://127.0.0.1:9/print"
          EOF
          IPP_DUPLEXD_FORK_CONFIG="$dir/config.toml" \
            ./target/debug/ipp-duplexd-fork --config "$dir/config.toml" &
          daemon=$!
          for _ in $(seq 1 50); do
            if curl -sf http://127.0.0.1:6699/ >/dev/null; then break; fi
            sleep 0.1
          done
          printf '#!/bin/sh\necho "$@" >> "%s/calls"\n' "$dir" > "$dir/lpadmin"
          printf '#!/bin/sh\nexit 0\n' > "$dir/lpstat"
          chmod +x "$dir/lpadmin" "$dir/lpstat"
          IPP_DUPLEXD_FORK_LPADMIN="$dir/lpadmin" \
            IPP_DUPLEXD_FORK_LPSTAT="$dir/lpstat" \
            IPP_DUPLEXD_FORK_CONFIG="$dir/config.toml" \
            xvfb-run -a env IPP_DUPLEXD_FORK_GUI_TEST=window \
              ./target/debug/ipp-duplexd-fork-gui --lang en
          kill "$daemon"
          grep -q -- '-p smoke-duplex' "$dir/calls"
          grep -q 'ipp://127.0.0.1:6699/ipp/print' "$dir/calls"

      # First run from the window: the machine has no unit, so "Set up" has to
      # write one, create the .conf the unit names, and enable it. Then the
      # other direction, which has to put the machine back into exactly that
      # state. systemctl is a stub, so the files are proven without a systemd
      # session and without touching the runner's own configuration.
      - name: The window installs the service on first run, and uninstalls it
        run: |
          set -eux
          dir=$(mktemp -d)
          mkdir -p "$dir/home"
          printf '#!/bin/sh\necho "$@" >> "%s/calls"\nexit 0\n' "$dir" > "$dir/systemctl"
          chmod +x "$dir/systemctl"
          cat > "$dir/config.toml" <<'EOF'
          [[printer]]
          name = "smoke-duplex"
          listen = "127.0.0.1:6699"
          real = "ipp://127.0.0.1:9/print"
          EOF
          env HOME="$dir/home" \
            IPP_DUPLEXD_FORK_CONFIG="$dir/config.toml" \
            IPP_DUPLEXD_FORK_SYSTEMCTL="$dir/systemctl" \
            IPP_DUPLEXD_FORK_GUI_TEST=setup \
            xvfb-run -a ./target/debug/ipp-duplexd-fork-gui --lang en
          unit="$dir/home/.config/systemd/user/ipp-duplexd-fork.service"
          test -f "$unit"
          grep -q 'ExecStart=.*/ipp-duplexd-fork ' "$unit"
          grep -q 'PartOf=graphical-session.target' "$unit"
          test -f "$dir/home/.config/ipp-duplexd-fork.conf"
          grep -q -- '--user enable --now ipp-duplexd-fork' "$dir/calls"
          env HOME="$dir/home" \
            IPP_DUPLEXD_FORK_CONFIG="$dir/config.toml" \
            IPP_DUPLEXD_FORK_SYSTEMCTL="$dir/systemctl" \
            IPP_DUPLEXD_FORK_GUI_TEST=uninstall \
            xvfb-run -a ./target/debug/ipp-duplexd-fork-gui --lang en
          test ! -f "$unit"
          test ! -f "$dir/home/.config/ipp-duplexd-fork.conf"
          grep -q -- '--user disable --now ipp-duplexd-fork' "$dir/calls"

      # No display: the daemon must not mistake that for a confirmation.
      - name: Without a display the dialog says so and exits 2
        run: |
          set +e
          out=$(env -u DISPLAY -u WAYLAND_DISPLAY ./target/debug/ipp-duplexd-fork-gui --flip demo 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 2
          grep -q "GET /flip" <<<"$out"

  # Looking native means being drawn by the desktop's own libadwaita, so the
  # newest stacks get a run of their own: Fedora 44 carries GNOME 50 and
  # rawhide carries GNOME 51. They are the only jobs here that do not pin an
  # older toolkit, and rawhide is allowed to be broken without reddening the
  # branch, because it moves under us.
  newest:
    name: GNOME ${{ matrix.gnome }} (Fedora ${{ matrix.release }})
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.release }}
    continue-on-error: ${{ matrix.release == 'rawhide' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "44"
            gnome: "50"
          - release: rawhide
            gnome: "51"
    steps:
      # The image has no git, and checkout runs before anything else would
      # install it.
      - name: Bootstrap the container
        run: dnf -y install git tar gzip

      - uses: actions/checkout@v4

      - name: Install the newest GTK4, libadwaita, Xvfb and qpdf
        run: |
          dnf -y install cargo rust clippy gtk4-devel libadwaita-devel qpdf \
            xorg-x11-server-Xvfb xorg-x11-xauth dbus-tools dbus-daemon \
            mesa-dri-drivers mesa-libGL mesa-libEGL libglvnd-gles
          dnf -y clean all

      - name: Show which toolkit this desktop has
        run: |
          pkg-config --modversion gtk4
          pkg-config --modversion libadwaita-1

      - name: Clippy
        run: cargo clippy --all-targets --features gui -- -D warnings

      - name: Test
        run: cargo test --features gui

      # The newest official API tier (GTK 4.24 / libadwaita 1.10) is a build
      # configuration of its own. Only Fedora rawhide has the toolkit for it;
      # the stable release keeps the broadly packagable tier.
      - name: Build against the newest toolkit tier
        if: matrix.release == 'rawhide'
        run: cargo build --release --features gui-newest

      # Both paths of the program, driven under the newest X server: the window
      # opens, and the dialog answers. A stylesheet that changed too much shows
      # up here rather than on somebody's desk.
      # A container has no compositor and no GPU, and GTK 4.22's window path
      # aborts or exits non-zero there for reasons that have nothing to do
      # with this program. The contract of this job is "builds and passes
      # its tests against GNOME 50/51"; the real window smoke test is
      # enforced on ubuntu in the gui job.
      - name: The window opens and the dialog answers
        continue-on-error: true
        run: |
          set -eux
          # A container has no session bus and no GPU, and GTK4 4.22 aborts
          # when its GL stack initialises half-way. Give it a private bus and
          # llvmpipe (the mesa packages above), which is all a headless smoke
          # test needs.
          headless() {
            dbus-run-session -- xvfb-run -a env \
              LIBGL_ALWAYS_SOFTWARE=1 GTK_A11Y=none \
              IPP_DUPLEXD_FORK_GUI_TEST="$1" \
              ./target/debug/ipp-duplexd-fork-gui "${@:2}"
          }
          headless window --lang zh-CN
          headless accept --flip "demo [odd pages]" --lang zh-CN

  # The AppImage is the "try it without installing" build. It embeds GTK4 and
  # libadwaita, so it needs the dev headers and a little longer than the other
  # jobs; in exchange, a broken build-appimage.sh fails here instead of on a
  # release.
  appimage:
    name: AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4, libadwaita, qpdf and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev qpdf xvfb
          sudo apt-get clean

      - name: Build and check the AppImage
        run: ./packaging/build-appimage.sh

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            packaging/*.AppImage
            packaging/*.AppImage.zsync
          if-no-files-found: error
