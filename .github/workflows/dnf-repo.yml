name: dnf repository

# Publishes an installable dnf repository on GitHub Pages, so Fedora users get
# `dnf install ipp-duplexd-fork` and `dnf upgrade` without downloading RPMs by hand
# and without a COPR account:
#
#   https://wraindrock.github.io/ipp-duplexd-fork/ipp-duplexd-fork.repo
#
# Every job here is a check as much as a build: the RPMs are installed from the
# generated repository in a clean container before anything is published, so a
# broken file list or a bad index fails the release instead of shipping.
#
# Only the newest build per Fedora release is kept in the repository; older
# versions stay on the GitHub releases page.

on:
  # Tags rebuild the repository: a release created by the release workflow
  # with GITHUB_TOKEN does not trigger a `release` event.
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dnf-repo
  cancel-in-progress: false

jobs:
  build:
    name: Build (Fedora ${{ matrix.release }})
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        release: ["43", "44", "rawhide"]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: dnf -y install cargo rust rpm-build make tar gzip qpdf createrepo_c gtk4-devel libadwaita-devel && dnf -y clean all

      - name: Build the package
        run: ./packaging/build-rpm.sh

      - name: Turn it into a dnf repository
        run: |
          dir="repo/fedora/${{ matrix.release }}/x86_64"
          mkdir -p "$dir"
          cp packaging/*.rpm "$dir/"
          # gzip, not createrepo_c's zstd default: every dnf/libdnf that might
          # read this repository understands it.
          createrepo_c --quiet --general-compress-type=gz "$dir"
          test -f "$dir/repodata/repomd.xml"
          metadata="$(ls "$dir/repodata")"
          case "$metadata" in
            *primary.xml.gz*) ;;
            *) echo "no primary metadata in $dir/repodata: $metadata"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.release }}
          path: repo/fedora/${{ matrix.release }}
          if-no-files-found: error

  verify:
    name: Install from the repository
    needs: build
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        release: ["43", "44", "rawhide"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: repo-${{ matrix.release }}
          path: repo/fedora/${{ matrix.release }}

      - name: Install it the way a user would, only from the generated files
        run: |
          repo="file://$PWD/repo/fedora/${{ matrix.release }}/x86_64"
          dnf -y --repofrompath=ipp-duplexd-fork,"$repo" \
                 --setopt=ipp-duplexd-fork.gpgcheck=0 \
                 install ipp-duplexd-fork
          rpm -q ipp-duplexd-fork

      - name: Check what got installed
        run: |
          files="$(rpm -ql ipp-duplexd-fork)"
          echo "$files"
          for f in /usr/bin/ipp-duplexd-fork /usr/bin/ipp-duplexd-fork-setup \
                   /usr/lib/systemd/user/ipp-duplexd-fork.service; do
            case "$files" in
              *"$f"*) ;;
              *) echo "missing from the package: $f"; exit 1 ;;
            esac
            test -e "$f"
          done
          # Fedora keeps the docs in /usr/share/doc/ipp-duplexd-fork, older rpmbuilds
          # in a directory carrying the version (Fedora leaves it out), so match the prefix.
          case "$files" in
            *"/usr/share/doc/ipp-duplexd-fork"*"/README.md"*) ;;
            *) echo "no README in the package"; exit 1 ;;
          esac
          case "$files" in
            *"/usr/share/licenses/ipp-duplexd-fork"*"/LICENSE"*) ;;
            *) echo "no LICENSE in the package"; exit 1 ;;
          esac
          # the catalogs are compiled in, so no locale files may be shipped
          case "$files" in
            *locales*|*.yml*|*.yaml*) echo "the package ships locale data"; exit 1 ;;
          esac
          # The docs are asserted from the package, not from the filesystem:
          # container images install with the "nodocs" rpm flag, which skips
          # them, and a real system does not. The binaries above are checked
          # both ways because they are what has to work.

      # The published package has to bring the application-menu entry; without
      # it the window is only reachable from a terminal.
      - name: The package appears in the desktop's application menu
        run: |
          set -eux
          entry=/usr/share/applications/io.github.wraindrock.ipp_duplexd_fork.desktop
          icon=/usr/share/icons/hicolor/512x512/apps/io.github.wraindrock.ipp_duplexd_fork.png
          test -f "$entry"
          test -s "$icon"
          grep -qx 'Exec=ipp-duplexd-fork-gui' "$entry"
          grep -qx 'Icon=io.github.wraindrock.ipp_duplexd_fork' "$entry"
          dnf -y install desktop-file-utils
          desktop-file-validate "$entry"

      - name: The binary still speaks both languages
        run: |
          en="$(ipp-duplexd-fork 2>&1 || true)"
          zh="$(ipp-duplexd-fork --lang zh-CN 2>&1 || true)"
          case "$en" in *"--printer is required"*) ;; *) echo "no English usage: $en"; exit 1;; esac
          case "$zh" in *"必须指定 --printer"*) ;; *) echo "no Chinese usage: $zh"; exit 1;; esac

  publish:
    name: Publish to GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: repo-*
          path: site/fedora

      - name: Assemble the site
        run: |
          for dir in site/fedora/repo-*; do
            release="${dir##*/repo-}"
            mv "$dir" "site/fedora/$release"
          done
          # A ready-made repository file: $releasever/$basearch pick the
          # directory built above, and the packages are unsigned.
          cat > site/ipp-duplexd-fork.repo <<'REPO'
          [ipp-duplexd-fork]
          name=ipp-duplexd-fork - manual duplex printing via a virtual IPP printer
          baseurl=https://wraindrock.github.io/ipp-duplexd-fork/fedora/$releasever/$basearch
          enabled=1
          gpgcheck=0
          repo_gpgcheck=0
          metadata_expire=6h
          REPO
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <title>ipp-duplexd-fork packages</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
            body { font: 16px/1.55 system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1.25rem; color: #1c1c1c; }
            h1 { font-size: 1.7rem; margin-bottom: .2rem; }
            h2 { font-size: 1.1rem; margin-top: 2rem; }
            p.sub { color: #666; margin-top: 0; }
            pre { background: #f3f3f3; border-radius: 6px; padding: .85rem 1rem; overflow-x: auto; }
            code { background: #f3f3f3; border-radius: 4px; padding: .1rem .3rem; }
            a { color: #0a6b4a; }
          </style>
          <h1>ipp-duplexd-fork</h1>
          <p class="sub">Manual duplex printing on any IPP printer &mdash; the dnf repository.</p>

          <p>This is the package repository for
          <a href="https://github.com/Wraindrock/ipp-duplexd-fork">ipp-duplexd-fork</a>, a fork of
          <a href="https://github.com/SamiKalliomaki/ipp-duplexd">ipp-duplexd</a> adding translations
          and, in time, a GUI manager.</p>

          <h2>Install</h2>
          <pre>sudo dnf config-manager addrepo --from-repofile=https://wraindrock.github.io/ipp-duplexd-fork/ipp-duplexd-fork.repo
          sudo dnf install ipp-duplexd-fork</pre>
          <p>On dnf4 (Fedora 40 and older) use <code>sudo dnf config-manager --add-repo</code> with the same URL.</p>

          <h2>Upgrade</h2>
          <pre>sudo dnf upgrade</pre>

          <h2>Notes</h2>
          <ul>
            <li>Built in Fedora 43, Fedora 44 and Rawhide containers; each release gets the newest build.</li>
            <li>Packages are unsigned, so the repository file sets <code>gpgcheck=0</code>.</li>
            <li>Older builds are on the <a href="https://github.com/Wraindrock/ipp-duplexd-fork/releases">releases page</a>;
                other distributions can use the <code>.rpm</code>, <code>.deb</code> or Arch package built there.</li>
            <li><a href="https://github.com/Wraindrock/ipp-duplexd-fork/blob/main/README.md">README</a> &middot;
                <a href="https://github.com/Wraindrock/ipp-duplexd-fork">Source</a> &middot;
                <a href="https://github.com/Wraindrock/ipp-duplexd-fork/issues">Issues</a></li>
          </ul>

          <h2>&#23433;&#35013;</h2>
          <p>&#21516;&#19978;&#20004;&#26465;&#21629;&#20196;&#65292;&#36825;&#26159; ipp-duplexd-fork
          &#30340; dnf &#36719;&#20214;&#28304;&#65292;&#21253;&#21547; Fedora 43/44/Rawhide &#30340;&#26500;&#24314;&#12290;</p>
          HTML
          ls -R site | head -40

      - name: Publish the gh-pages branch
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "dnf repository: ${GITHUB_REF_NAME}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}

  published:
    name: Install from the published repository
    needs: publish
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        release: ["43", "44", "rawhide"]
    steps:
      - name: Wait until the served repository is complete
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          dnf -y install python3 >/dev/null
          python3 - <<'PY'
          import gzip, hashlib, os, time
          import urllib.request
          import xml.etree.ElementTree as ET

          base = "https://wraindrock.github.io/ipp-duplexd-fork/fedora/" + os.environ["RELEASE"] + "/x86_64"
          repofile = "https://wraindrock.github.io/ipp-duplexd-fork/ipp-duplexd-fork.repo"
          ns = {"r": "http://linux.duke.edu/metadata/repo",
                "c": "http://linux.duke.edu/metadata/common"}

          def fetch(url):
              with urllib.request.urlopen(url, timeout=60) as response:
                  return response.read()

          def problem():
              """Return why the published repository is not usable yet, or None."""
              if b"ipp-duplexd-fork" not in fetch(repofile):
                  return "the repository file does not name the package yet"
              repomd = ET.fromstring(fetch(base + "/repodata/repomd.xml"))
              primary = repomd.find("r:data[@type='primary']/r:location", ns).get("href")
              index = ET.fromstring(gzip.decompress(fetch(base + "/" + primary)))
              packages = index.findall("c:package", ns)
              if not packages:
                  return "the index lists no package"
              for package in packages:
                  location = package.find("c:location", ns).get("href")
                  wanted = package.find("c:checksum", ns).text
                  body = fetch(base + "/" + location)
                  if hashlib.sha256(body).hexdigest() != wanted:
                      return location + " does not match its checksum yet"
              return None

          for attempt in range(1, 31):
              try:
                  why = problem()
              except Exception as error:
                  why = str(error)
              if why is None:
                  print("the published repository is complete, and its package matches its checksum")
                  break
              print("attempt %d: %s" % (attempt, why))
              time.sleep(10)
          else:
              raise SystemExit("the published repository never became complete")
          PY
      - name: Install the way the README tells people to
        run: |
          curl -fsS -o /etc/yum.repos.d/ipp-duplexd-fork.repo \
            https://wraindrock.github.io/ipp-duplexd-fork/ipp-duplexd-fork.repo
          cat /etc/yum.repos.d/ipp-duplexd-fork.repo
          dnf -y install ipp-duplexd-fork
          rpm -q ipp-duplexd-fork
          ipp-duplexd-fork --lang zh-CN 2>&1 | grep -q '必须指定 --printer'
