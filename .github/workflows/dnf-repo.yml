name: dnf repository

# Publishes an installable dnf repository on GitHub Pages, so Fedora users get
# `dnf install ipp-duplexd` and `dnf upgrade` without downloading RPMs by hand
# and without a COPR account:
#
#   https://wraindrock.github.io/ipp-duplexd-fork/ipp-duplexd.repo
#
# Every job here is a check as much as a build: the RPMs are installed from the
# generated repository in a clean container before anything is published, so a
# broken file list or a bad index fails the release instead of shipping.
#
# Only the newest build per Fedora release is kept in the repository; older
# versions stay on the GitHub releases page.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dnf-repo
  cancel-in-progress: false

jobs:
  build:
    name: Build (Fedora ${{ matrix.release }})
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        release: ["43", "44", "rawhide"]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: dnf -y install cargo rust rpm-build make tar gzip qpdf createrepo_c && dnf -y clean all

      - name: Build the package
        run: ./packaging/build-rpm.sh

      - name: Turn it into a dnf repository
        run: |
          dir="repo/fedora/${{ matrix.release }}/x86_64"
          mkdir -p "$dir"
          cp packaging/*.rpm "$dir/"
          # gzip, not createrepo_c's zstd default: every dnf/libdnf that might
          # read this repository understands it.
          createrepo_c --quiet --general-compress-type=gz "$dir"
          test -f "$dir/repodata/repomd.xml"
          metadata="$(ls "$dir/repodata")"
          case "$metadata" in
            *primary.xml.gz*) ;;
            *) echo "no primary metadata in $dir/repodata: $metadata"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.release }}
          path: repo/fedora/${{ matrix.release }}
          if-no-files-found: error

  verify:
    name: Install from the repository
    needs: build
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        release: ["43", "44", "rawhide"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: repo-${{ matrix.release }}
          path: repo/fedora/${{ matrix.release }}

      - name: Install it the way a user would, only from the generated files
        run: |
          repo="file://$PWD/repo/fedora/${{ matrix.release }}/x86_64"
          dnf -y --repofrompath=ipp-duplexd,"$repo" \
                 --setopt=ipp-duplexd.gpgcheck=0 \
                 install ipp-duplexd
          rpm -q ipp-duplexd

      - name: Check what got installed
        run: |
          files="$(rpm -ql ipp-duplexd)"
          echo "$files"
          for f in /usr/bin/ipp-duplexd /usr/bin/ipp-duplexd-setup \
                   /usr/lib/systemd/user/ipp-duplexd.service; do
            case "$files" in
              *"$f"*) ;;
              *) echo "missing from the package: $f"; exit 1 ;;
            esac
            test -e "$f"
          done
          # Fedora keeps the docs in /usr/share/doc/ipp-duplexd, older rpmbuilds
          # in /usr/share/doc/ipp-duplexd-0.1.3, so match on the prefix only.
          case "$files" in
            *"/usr/share/doc/ipp-duplexd"*"/README.md"*) ;;
            *) echo "no README in the package"; exit 1 ;;
          esac
          case "$files" in
            *"/usr/share/licenses/ipp-duplexd"*"/LICENSE"*) ;;
            *) echo "no LICENSE in the package"; exit 1 ;;
          esac
          # the catalogs are compiled in, so no locale files may be shipped
          case "$files" in
            *locales*|*.yml*|*.yaml*) echo "the package ships locale data"; exit 1 ;;
          esac
          # The docs are asserted from the package, not from the filesystem:
          # container images install with the "nodocs" rpm flag, which skips
          # them, and a real system does not. The binaries above are checked
          # both ways because they are what has to work.

      - name: The binary still speaks both languages
        run: |
          en="$(ipp-duplexd 2>&1 || true)"
          zh="$(ipp-duplexd --lang zh-CN 2>&1 || true)"
          case "$en" in *"--printer is required"*) ;; *) echo "no English usage: $en"; exit 1;; esac
          case "$zh" in *"必须指定 --printer"*) ;; *) echo "no Chinese usage: $zh"; exit 1;; esac

  publish:
    name: Publish to GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: repo-*
          path: site/fedora

      - name: Assemble the site
        run: |
          for dir in site/fedora/repo-*; do
            release="${dir##*/repo-}"
            mv "$dir" "site/fedora/$release"
          done
          # A ready-made repository file: $releasever/$basearch pick the
          # directory built above, and the packages are unsigned.
          cat > site/ipp-duplexd.repo <<'REPO'
          [ipp-duplexd]
          name=ipp-duplexd - manual duplex printing via a virtual IPP printer
          baseurl=https://wraindrock.github.io/ipp-duplexd-fork/fedora/$releasever/$basearch
          enabled=1
          gpgcheck=0
          repo_gpgcheck=0
          metadata_expire=6h
          REPO
          ls -R site | head -40

      - name: Publish the gh-pages branch
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "dnf repository: ${GITHUB_REF_NAME}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}

  published:
    name: Install from the published repository
    needs: publish
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        release: ["43", "44", "rawhide"]
    steps:
      - name: Wait for GitHub Pages to serve it
        run: |
          url="https://wraindrock.github.io/ipp-duplexd-fork/fedora/${{ matrix.release }}/x86_64/repodata/repomd.xml"
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -m 20 "$url" || true)"
            case "$code" in
              200) echo "$url is being served (attempt $attempt)"; exit 0 ;;
            esac
            echo "attempt $attempt: HTTP $code"
            sleep 10
          done
          echo "GitHub Pages never served $url"
          exit 1

      - name: Install the way the README tells people to
        run: |
          curl -fsS -o /etc/yum.repos.d/ipp-duplexd.repo \
            https://wraindrock.github.io/ipp-duplexd-fork/ipp-duplexd.repo
          cat /etc/yum.repos.d/ipp-duplexd.repo
          dnf -y install ipp-duplexd
          rpm -q ipp-duplexd
          ipp-duplexd --lang zh-CN 2>&1 | grep -q '必须指定 --printer'
