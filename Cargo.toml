[package]
name = "ipp-duplexd-fork"
version = "2026.10.29-9"
edition = "2021"
authors = ["Sami Kalliomäki <sami@kalliomaki.me>"]
description = "Loopback IPP printer that performs manual duplex on a real IPP printer"
license = "MIT"
repository = "https://github.com/Wraindrock/ipp-duplexd-fork"

[features]
default = []
# The GTK4 dialog and (later) the manager window. Built against the API tier
# this program actually uses (libadwaita 1.5), so distributions that still ship
# an older toolkit can package it.
gui = ["dep:gtk4", "dep:libadwaita"]
# Same window, compiled against the newest GTK and libadwaita API tiers
# (GTK 4.24 / libadwaita 1.10, as shipped by GNOME 51). Needs a newer build
# host, offers no extra behaviour today; it exists so that a build against the
# newest official toolkit is a first-class, tested configuration.
gui-newest = ["gui", "gtk4/v4_24", "libadwaita/v1_10"]

[dependencies]
rust-i18n = "4"

# The configuration file (which virtual printers exist) is shared by the daemon
# and the manager window, so it lives in the library crate.
serde = { version = "1", features = ["derive"] }
toml = "1"
gtk4 = { version = "0.11", optional = true }
libadwaita = { version = "0.9", optional = true, features = ["v1_5"] }

[[bin]]
name = "ipp-duplexd-fork"
path = "src/main.rs"

[[bin]]
name = "ipp-duplexd-fork-setup"
path = "src/bin/ipp-duplexd-fork-setup.rs"

[[bin]]
name = "ipp-duplexd-fork-gui"
path = "src/bin/ipp-duplexd-fork-gui.rs"
required-features = ["gui"]

[profile.release]
strip = true
