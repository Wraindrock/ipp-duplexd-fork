# 上一段对话框文案由桌面端复用；以下只属于它自己的命令行与失败提示。
gui.usage: |
  ipp-duplexd-fork-gui —— 桌面端。

  不带参数运行会打开窗口：显示守护进程的状态，以及翻好纸之后用来打印背面的按钮。

  用法：
    ipp-duplexd-fork-gui                       打开窗口
    ipp-duplexd-fork-gui --flip 作业名 [--lang 语言代码]

  --flip 作业名  询问纸张是否已经翻好；退出码 0 表示打印背面，
               1 表示继续等待 GET /flip
  --lang 语言代码  窗口和对话框使用的语言（默认取自环境变量）
  --version    显示版本
  --help       显示本帮助

  窗口里现在显示守护进程在做什么；打印机、作业和设置以后会在这里长大。
