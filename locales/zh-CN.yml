# ------------------------------------------------ 守护进程：命令行与启动信息
daemon.usage: |
  用法：ipp-duplexd-fork --printer ipp://HOST[:PORT]/PATH [选项]

    --printer URI        真实打印机（推荐用本机 CUPS 队列：
                         ipp://127.0.0.1:631/printers/名称）
    --config PATH        服务该文件里的每个 [[printer]]（默认在
                         ~/.config/ipp-duplexd-fork/config.toml 存在时使用；
                         管理窗口负责写它，POST /reload 会重新读取）
    --listen ADDR:PORT   监听地址（默认 127.0.0.1:6632）
    --name NAME          对外公布的打印机名（默认 manual-duplex）
    --blank WHERE        页数为奇数时空白页补在哪里：
                         leading（默认，放前面）| trailing（放后面）| none
    --auto-continue N    奇数页打完后等 N 秒自动打印背面，
                         不再等待 GET /flip
    --no-gui             不弹出翻纸确认对话框（zenity/kdialog/xmessage），
                         只靠 GET /flip
    --rotate-even 0|180  把偶数页旋转 180 度（默认 180；如果按你的翻面
                         方向背面出来是倒着的，就改成 0）
    --poll N             查询真实打印机作业状态的间隔秒数（默认 2）
    --settle N           奇数页打印完后等真实打印机恢复的秒数（默认 10；
                         期间等打印机空闲，超时就直接送偶数页）
    --lang CODE          消息与状态页的语言（en、zh-CN；默认取自
                         $IPP_DUPLEXD_FORK_LANG、$LANGUAGE、$LC_ALL 或 $LANG）
