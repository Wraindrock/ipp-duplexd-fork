setup.usage: |
  用法：ipp-duplexd-fork-setup [选项]

    不带选项时进入终端菜单：虚拟打印机、作业、服务、日志与状态、设置——
    和窗口里的操作树一致，写的是同一个配置文件。

    --printer URI    不提问，直接配置一台打印机（配合 --yes）
    --listen ADDR    这台打印机监听的地址
    --no-service     不安装、不启动服务
    --no-queue       不注册 CUPS 队列
    --yes            全部取默认值，什么都不问
    --lang CODE      消息语言（en、zh-CN；默认取自环境）
setup.err.unknown_option: "无法识别的选项 '%{arg}'"
setup.err.bad_lang: "不支持的语言 '%{lang}'；可用语言：%{list}"
setup.err.no_printer: "没找到打印机：接一台，或者用 --printer 指定"
setup.ask.advanced: "要改高级选项吗（翻纸对话框、旋转、空白页）？"
