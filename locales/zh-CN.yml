# ---------------------------------------------------------------- 安装向导
setup.usage: |
  ipp-duplexd-fork-setup —— 配置手动双面虚拟打印机

  依次完成：选择真实打印机、写入 ~/.config/ipp-duplexd-fork.conf、
  启用 ipp-duplexd-fork 的 systemd 用户服务、把虚拟打印机添加为
  CUPS 的无驱动队列。

  选项（全部可选；没给的会交互询问）：
    --printer URI     真实打印机，例如 ipp://127.0.0.1:631/printers/laser
    --queue NAME      虚拟打印机在 CUPS 里的队列名
    --listen ADDR     ipp-duplexd-fork 的监听地址（默认 127.0.0.1:6632）
    --lang CODE       消息语言（en、zh-CN）
    --no-service      跳过 systemd 服务这一步
    --no-queue        跳过 CUPS 队列这一步
    --yes             不再提问，未给出的选项用默认值
    -h, --help        显示本帮助
