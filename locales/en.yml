# ------------------------------------------------------- daemon: the GUI
# The GTK4 front end (--features gui) reuses the dialog text above; these are
# its own command line and failure messages.
gui.usage: |
  ipp-duplexd-fork-gui - the desktop front end.

  Usage:
    ipp-duplexd-fork-gui --flip JOB [--lang CODE]

  --flip JOB   ask whether the stack was flipped; exit 0 prints the backs,
               exit 1 leaves the job waiting for GET /flip
  --lang CODE  language of the dialog (default: from the environment)
  --version    print the version
  --help       print this help

  The manager window (printers, jobs, settings) is the next thing to be built
  on top of this dialog.
gui.err.needs_value: "%{what} needs a value"
gui.err.unknown_arg: "unknown argument '%{arg}'"
gui.err.bad_lang: "bad language '%{lang}'; known languages: %{list}"
gui.err.no_display: "cannot open a display (%{err}); the daemon keeps waiting for GET /flip"

# ---------------------------------------------------------- setup wizard
setup.usage: |
  ipp-duplexd-fork-setup — set up the manual duplex virtual printer

  Walks through: choosing the real printer, writing ~/.config/ipp-duplexd-fork.conf,
  enabling the ipp-duplexd-fork systemd user service, and adding the virtual printer
  as a driverless CUPS queue.

  Options (all optional; anything not given is asked interactively):
    --printer URI     real printer, e.g. ipp://127.0.0.1:631/printers/laser
    --queue NAME      CUPS queue name for the virtual printer
    --listen ADDR     ipp-duplexd-fork listen address       (default 127.0.0.1:6632)
    --lang CODE       language of the messages (en, zh-CN)
    --no-service      skip the systemd service step
    --no-queue        skip the CUPS queue step
    --yes             no questions; use defaults for anything not given
    -h, --help        this help
setup.err.unknown_option: "unknown option '%{arg}'"
setup.err.bad_lang: "unsupported language '%{lang}'; known languages: %{list}"
setup.err.no_qpdf: "! qpdf is not installed — ipp-duplexd-fork needs it to split pages."
